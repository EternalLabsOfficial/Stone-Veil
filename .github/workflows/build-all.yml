
name: Build Stone Veil for all platforms

on:
  workflow_dispatch:
  push:
    paths:
      - 'stone-veil-cloud-build-kit-v0.5.6.zip'
      - '.github/workflows/build-all.yml'

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: macos-latest
            command: dist:mac
          - os: ubuntu-latest
            command: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir buildkit
          unzip -q stone-veil-cloud-build-kit-v0.5.6.zip -d buildkit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: buildkit/stone-veil-cloud-build-kit/stone-veil-multiplatform/desktop
        run: npm install

      - name: Build desktop version
        working-directory: buildkit/stone-veil-cloud-build-kit/stone-veil-multiplatform/desktop
        run: npm run ${{ matrix.command }}

      - name: Upload desktop files
        uses: actions/upload-artifact@v4
        with:
          name: stone-veil-${{ matrix.command }}
          path: buildkit/stone-veil-cloud-build-kit/stone-veil-multiplatform/desktop/dist/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir buildkit
          unzip -q stone-veil-cloud-build-kit-v0.5.6.zip -d buildkit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: buildkit/stone-veil-cloud-build-kit/stone-veil-multiplatform/android
        run: gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: stone-veil-android-apk
          path: buildkit/stone-veil-cloud-build-kit/stone-veil-multiplatform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
